# =============================================================================
# CityFlow AI — continuous integration
# =============================================================================
# Runs on every push and pull request. Four independent jobs, so a Python
# failure does not hide a TypeScript one and the slow job does not gate the
# fast ones.
#
# WHAT THIS CATCHES THAT LOCAL WORK DOES NOT
# A clean checkout on a clean machine. Most breakages that reach a repository
# are a file that was never committed or a dependency that only exists in
# somebody's local node_modules — and both of those pass on the machine they
# were written on.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the suite can be run by hand against a branch before opening a PR.
  workflow_dispatch:

# A second push cancels the first run on the same branch. Nobody needs CI
# results for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- web: types
  web-typecheck:
    name: Web · types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code, and nothing typechecks without it.
      # No database is contacted — `generate` only reads the schema file.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npm run typecheck

  # ---------------------------------------------------------------- web: tests
  web-tests:
    name: Web · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # These suites cover the pure logic modules: the recommendation engine,
      # the trip planner, the savings estimator and the repair state machine.
      # None of them touches a database.
      - name: Unit tests
        run: npm test

  # ---------------------------------------------------------------- web: build
  web-build:
    name: Web · production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # A real `next build`. This is the check that catches the class of error
      # typechecking cannot: a server component importing something that only
      # runs in the browser, a bad route export, a page that fails to compile.
      #
      # DATABASE_URL is a placeholder. The build generates the Prisma client and
      # compiles pages; it never opens a connection.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-secret-at-least-32-characters-long
          NEXT_TELEMETRY_DISABLED: "1"

  # -------------------------------------------------------------- ml: tests
  ml-tests:
    name: ML service · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      # Prophet compiles a Stan backend on install, which is why this job is the
      # slow one. It is cached on requirements.txt, so it only pays that cost
      # when the dependencies actually change.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # The optimiser tests assert the product's central claim directly: that no
      # new peak is created, that total demand is conserved, and that somebody
      # who declared no flexibility is never moved.
      - name: Fast tests
        run: pytest

      # RUN THE SLOW TEST TOO — this step exists because of a real break.
      #
      # `pytest.ini` excludes the `slow` marker by default, which keeps the
      # local loop quick. But the only test that FITS A REAL PROPHET MODEL is
      # marked slow, so the default run proves Prophet is installed and nothing
      # more.
      #
      # That gap let a genuine failure through: pip resolved cmdstanpy 1.3.0
      # against prophet 1.1.6, the Stan backend would not load at all, and
      # every fast test still passed. The fix was pinning cmdstanpy; this step
      # is what would have caught it in the first place.
      #
      # It costs about 40 seconds. A forecasting service whose forecasting is
      # never executed in CI is not being tested.
      - name: Prophet integration test
        run: pytest -m slow
