# =============================================================================
# CityFlow AI — reverse proxy
# =============================================================================
# One entry point in front of two services:
#
#   /        -> the Next.js web application
#   /ml/     -> the Python forecasting service
#
# WHY THE ML SERVICE IS BEHIND THE SAME HOST
# It holds no personal data, but it will happily spend CPU on any request, so it
# is not exposed directly. Only this proxy can reach it (Compose puts it on an
# internal network with no published port), and the web application authenticates
# to it with a shared secret on top.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the upstream response time. A forecast that has quietly gone from 2 to
    # 30 seconds shows up here long before anybody reports "the site is slow".
    log_format cityflow '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent '
                        'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log cityflow;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Compress text responses. Images and fonts are already compressed, so
    # gzipping them wastes CPU for nothing.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # Rate limit zones. The forecasting endpoints are far more expensive than a
    # page load, so they get their own, much tighter, bucket.
    limit_req_zone $binary_remote_addr zone=web:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ml:10m   rate=2r/s;

    upstream web {
        server web:3000;
        keepalive 32;
    }

    upstream ml {
        server ml:8000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # Uploaded road-issue photos are downscaled in the browser, but a
        # deliberate oversized request should be refused here rather than being
        # streamed all the way to the application.
        client_max_body_size 2m;

        # --- Security headers -------------------------------------------------
        # Set at the proxy so they apply to every response from every upstream,
        # including error pages the application never sees.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Geolocation and motion sensors ARE used, by the road-condition
        # detector, so they are allowed for this origin only.
        add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), camera=(self), microphone=()" always;

        # --- The forecasting service -----------------------------------------
        location /ml/ {
            limit_req zone=ml burst=5 nodelay;

            proxy_pass         http://ml/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Fitting Prophet on ninety days of 15-minute data takes a couple of
            # seconds, and a cold container takes longer. 60s is generous enough
            # not to cut off a legitimate first request.
            proxy_read_timeout 60s;
        }

        # --- The web application ---------------------------------------------
        location / {
            limit_req zone=web burst=60 nodelay;

            proxy_pass         http://web;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
